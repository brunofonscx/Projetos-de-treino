    <script>
        function clicar() {
            const inputNome = document.getElementById('inome')
            const nome = inputNome.value
            const resultado = document.getElementById('resultado')
            if (nome.length < 3){
            resultado.innerHTML = "Nome invalido!"
            } else {
                resultado.innerHTML = `<p>O seu nome e ${nome}!<br> E ele tem
                ${nome.length} letras.</p>`
                
            }
           
        }
        
    </script>
